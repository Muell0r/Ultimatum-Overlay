name: Build Windows exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: python -m PyInstaller --noconfirm --onefile --name UltimatumCardOverlay --collect-all rapidocr_onnxruntime --collect-all onnxruntime ultimatum_card_overlay.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: UltimatumCardOverlay
          path: dist/UltimatumCardOverlay.exe
          if-no-files-found: error

